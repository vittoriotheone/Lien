<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140c22">
<title>Lien</title>
<style>
html,body,#root{margin:0;padding:0;width:100%;height:100%;min-width:0;max-width:100%;background:#140c22;overflow:hidden;overscroll-behavior-x:none}
body{overflow-x:hidden;touch-action:pan-y}
#root>div{width:100%!important;height:100dvh!important;min-height:100dvh!important;max-height:100dvh!important;padding:0!important;margin:0!important;display:flex!important;align-items:stretch!important;justify-content:stretch!important;overflow:hidden!important;box-sizing:border-box!important}
#root .duo-root{width:100%!important;max-width:none!important;height:100dvh!important;min-height:0!important;max-height:100dvh!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:hidden!important;box-sizing:border-box!important}
#root .duo-root>div[style*="width: 70px"]{display:none!important}
#root .duo-root div[style*="cursor: ns-resize"]{touch-action:none!important;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
#root button[aria-label="Ouvrir les messages"]{bottom:142px!important;right:14px!important;z-index:100!important}
#boot-error{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#140c22;color:#f5efe6;font-family:system-ui;text-align:center}
#boot-error>div{max-width:650px}#boot-error h1{color:#ff8b66}#boot-error pre{white-space:pre-wrap;text-align:left;background:rgba(255,255,255,.06);padding:14px;border-radius:12px;font-size:12px;overflow:auto}
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error"><div><h1>Impossible de charger Lien</h1><p>Une erreur JavaScript empêche l'application de démarrer.</p><pre id="boot-error-message"></pre></div></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
window.addEventListener('error',e=>{if(e.error){const b=document.getElementById('boot-error'),m=document.getElementById('boot-error-message');if(b&&m){m.textContent=e.error.stack||e.error.message||String(e.error);b.style.display='flex';}}});
window.addEventListener('unhandledrejection',e=>{const b=document.getElementById('boot-error'),m=document.getElementById('boot-error-message');if(b&&m){m.textContent=e.reason?.stack||String(e.reason||'Erreur inconnue');b.style.display='flex';}});
</script>
<script src="./app.js?v=20260813-4"></script>
</body>
</html>
