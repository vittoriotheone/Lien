<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lien</title>
  <style>
/* ===== AFFICHAGE MOBILE PLEIN ÉCRAN ===== */

html,
body,
#root {
  width: 100%;
  height: 100%;
  min-width: 0 !important;
  max-width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow: hidden !important;
  overscroll-behavior: none !important;
  touch-action: pan-y !important;
}

/* Retire le cadre téléphone */
#root > div {
  width: 100% !important;
  height: 100dvh !important;
  min-height: 100dvh !important;
  max-height: 100dvh !important;
  padding: 0 !important;
  margin: 0 !important;
  display: flex !important;
  align-items: stretch !important;
  justify-content: stretch !important;
  overflow: hidden !important;
  box-sizing: border-box !important;
}

#root .duo-root {
  width: 100% !important;
  max-width: none !important;
  height: 100dvh !important;
  min-height: 0 !important;
  max-height: 100dvh !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  overflow: hidden !important;
  box-sizing: border-box !important;
}

/* Ancienne encoche du téléphone */
#root .duo-root > div[style*="width: 70px"] {
  display: none !important;
}

/* Empêche absolument le déplacement gauche/droite */
#root,
#root .duo-root,
#root .duo-root > * {
  max-width: 100vw !important;
}

body {
  overscroll-behavior-x: none !important;
}

/* ===== ADAPTATION À LA HAUTEUR DU TÉLÉPHONE ===== */

/* Le contenu principal ne peut plus pousser la navigation hors écran */
#root .duo-root {
  display: flex !important;
  flex-direction: column !important;
}

/* Le bouton messages reste accessible au-dessus de la navigation */
#root button[aria-label="Ouvrir les messages"] {
  bottom: 142px !important;
  right: 14px !important;
  z-index: 100 !important;
}

/* ===== CHAT ===== */

#root .duo-root div[style*="cursor: ns-resize"] {
  touch-action: none !important;
  -webkit-user-select: none !important;
  user-select: none !important;
  -webkit-touch-callout: none !important;
}

/* La fenêtre de messages ne peut jamais dépasser l'écran */
#root .duo-root div[style*="position: absolute"][style*="height:"] {
  max-height: calc(100dvh - 150px) !important;
}

/* Empêche les éléments du chat de créer une largeur supplémentaire */
#root .duo-root input,
#root .duo-root button {
  max-width: 100%;
  box-sizing: border-box;
}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
