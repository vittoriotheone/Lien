<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lien</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body,#root{margin:0;padding:0;min-height:100%;background:#140c22}body{min-height:100vh;overflow-x:hidden}#boot-error{display:none;position:fixed;inset:0;z-index:99999;box-sizing:border-box;padding:24px;background:#140c22;color:#f5efe6;font:14px system-ui,sans-serif;align-items:center;justify-content:center}#boot-error>div{max-width:760px;width:100%}#boot-error pre{white-space:pre-wrap;word-break:break-word;background:#211632;padding:16px;border-radius:12px;color:#ffb39a}</style>
</head><body>
<div id="root"></div><div id="boot-error"><div><h2>Impossible de charger Lien</h2><p>Erreur JavaScript :</p><pre id="boot-error-text"></pre></div></div>
<script>window.addEventListener('error',function(e){var b=document.getElementById('boot-error'),t=document.getElementById('boot-error-text');if(b&&t){t.textContent=(e.error&&e.error.stack)||e.message||String(e);b.style.display='flex'}});window.addEventListener('unhandledrejection',function(e){var b=document.getElementById('boot-error'),t=document.getElementById('boot-error-text');if(b&&t){t.textContent=(e.reason&&e.reason.stack)||String(e.reason);b.style.display='flex'}});</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="./app.js"></script>
</body></html>
