<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#140c22" />
  <title>Lien</title>
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #140c22;
    }
    body { overflow-x: hidden; }
    #boot-error {
      display: none;
      box-sizing: border-box;
      position: fixed;
      inset: 0;
      padding: 24px;
      background: #140c22;
      color: #f5efe6;
      font-family: system-ui, -apple-system, sans-serif;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #boot-error > div { max-width: 620px; }
    #boot-error h1 { color: #ff8b66; font-size: 22px; }
    #boot-error pre {
      white-space: pre-wrap;
      text-align: left;
      background: rgba(255,255,255,.06);
      padding: 14px;
      border-radius: 12px;
      overflow: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="boot-error">
    <div>
      <h1>Impossible de charger Lien</h1>
      <p>Une erreur JavaScript empêche l'application de démarrer.</p>
      <pre id="boot-error-message"></pre>
    </div>
  </div>

  <script>
    window.addEventListener("error", function (event) {
      const box = document.getElementById("boot-error");
      const message = document.getElementById("boot-error-message");
      if (!box || !message) return;
      message.textContent = event.error?.stack || event.message || "Erreur inconnue";
      box.style.display = "flex";
    });
    window.addEventListener("unhandledrejection", function (event) {
      const box = document.getElementById("boot-error");
      const message = document.getElementById("boot-error-message");
      if (!box || !message) return;
      message.textContent = event.reason?.stack || String(event.reason || "Erreur inconnue");
      box.style.display = "flex";
    });
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- app.js is intentionally loaded through Babel because it contains JSX. -->
  <script type="text/babel" data-presets="react" src="./app.js"></script>
</body>
</html>
