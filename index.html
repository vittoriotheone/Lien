<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140c22">
  <title>Lien</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html,body,#root{margin:0;padding:0;min-height:100%;background:#140c22}
    body{min-height:100vh;overflow-x:hidden}
    #boot-error{display:none;position:fixed;inset:0;z-index:99999;box-sizing:border-box;padding:24px;background:#140c22;color:#f5efe6;font:14px system-ui,-apple-system,sans-serif;align-items:center;justify-content:center}
    #boot-error>div{max-width:760px;width:100%}
    #boot-error h1{color:#ff8b66;font-size:22px}
    #boot-error pre{white-space:pre-wrap;word-break:break-word;background:#211735;border-radius:12px;padding:14px;max-height:60vh;overflow:auto}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error"><div><h1>Impossible de charger Lien</h1><p>Une erreur JavaScript empêche l'application de démarrer.</p><pre id="boot-error-message"></pre></div></div>
  <script>
    window.addEventListener('error', function(e){
      var b=document.getElementById('boot-error'),m=document.getElementById('boot-error-message');
      if(!b||!m)return;m.textContent=(e.error&&e.error.stack)||e.message||'Erreur inconnue';b.style.display='flex';
    });
    window.addEventListener('unhandledrejection', function(e){
      var b=document.getElementById('boot-error'),m=document.getElementById('boot-error-message');
      if(!b||!m)return;m.textContent=(e.reason&&e.reason.stack)||String(e.reason||'Erreur inconnue');b.style.display='flex';
    });
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="./app.jsx"></script>
</body>
</html>
