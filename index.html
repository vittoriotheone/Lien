<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#140c22">
  <title>Lien</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body, #root { margin:0; padding:0; min-height:100vh; background:#140c22; }
    body { overflow-x:hidden; }
    #boot-error { display:none; box-sizing:border-box; position:fixed; inset:0; padding:24px; background:#140c22; color:#f5efe6; font-family:system-ui,-apple-system,sans-serif; align-items:center; justify-content:center; text-align:center; z-index:9999; }
    #boot-error > div { max-width:700px; }
    #boot-error h1 { color:#ff8b66; font-size:22px; }
    #boot-error pre { white-space:pre-wrap; text-align:left; background:rgba(255,255,255,.06); padding:14px; border-radius:12px; overflow:auto; font-size:12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error"><div><h1>Impossible de charger Lien</h1><p>Une erreur JavaScript empêche l'application de démarrer.</p><pre id="boot-error-message"></pre></div></div>
  <script>
    window.addEventListener('error', function(e) {
      var box=document.getElementById('boot-error'), msg=document.getElementById('boot-error-message');
      if(!box||!msg) return;
      msg.textContent=(e.error&&e.error.stack)||e.message||'Erreur inconnue'; box.style.display='flex';
    });
    window.addEventListener('unhandledrejection', function(e) {
      var box=document.getElementById('boot-error'), msg=document.getElementById('boot-error-message');
      if(!box||!msg) return;
      msg.textContent=(e.reason&&e.reason.stack)||String(e.reason||'Erreur inconnue'); box.style.display='flex';
    });
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="./app.jsx"></script>
</body>
</html>
